name: Build & Release Deluge

permissions: write-all

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Deluge version to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - 2.0.5
          - 2.1.0
          - 2.1.1
          - 2.1.2.dev0

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generating matrix
        id: generate
        run: |
          echo "Generating matrix..."
          MATRIX=$(python3 matrix.py)
          echo "$MATRIX" > matrix.json
          echo "matrix<<EOF" >> $GITHUB_ENV
          cat matrix.json >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup matrix
        id: set
        uses: druzsan/setup-matrix@v2
        with:
          matrix: |
            ${{ env.matrix }}

  build:
    name: v${{ matrix.version }} (${{ matrix.os }})
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    container:
      image: ${{ 
        startsWith(matrix.os, 'debian-') && (matrix.os == 'debian-11' && 'debian:bullseye' || matrix.os == 'debian-12' && 'debian:bookworm' || 'debian:bookworm') ||
        startsWith(matrix.os, 'ubuntu-') && format('{0}:{1}', 'ubuntu', matrix.os == 'ubuntu-latest' && 'noble' || matrix.os == 'ubuntu-22.04' && '22.04' || matrix.os == 'ubuntu-24.04' && '24.04' || matrix.os) || '' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      COMMITTER_NAME: ${{ secrets.COMMITTER_NAME }}
      COMMITTER_EMAIL: ${{ secrets.COMMITTER_EMAIL }}
      STABILITY: ${{ matrix.stability }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Debug context
        run: |
          echo "Matrix: ${{ toJson(matrix) }}"

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tools repository
        uses: actions/checkout@v4
        with:
          repository: MediaEase-binaries/tools
          path: tools

      - name: Bootstrap container (update + deps)
        run: |
          apt-get update
          apt-get upgrade -y
          apt-get install -y --no-install-recommends \
            apt-transport-https rsync lsb-release curl wget imagemagick git gzip util-linux dnsutils dirmngr acl iptables-persistent software-properties-common psmisc gnupg2 ca-certificates gpg-agent iproute2 dos2unix nfs-common jq sudo locales debconf-utils net-tools build-essential bc automake make cmake checkinstall libnss3-tools nano zip unzip htop vnstat vnstati vsftpd subversion ssl-cert openssl libfcgi0ldbl libsqlite3-dev sqlite3 libtool libcppunit-dev libssl-dev fontconfig libfontconfig1 libfontconfig1-dev zlib1g-dev libbz2-dev libreadline-dev libcairo2-dev libcurl4-openssl-dev libgirepository1.0-dev llvm libncurses5-dev libncursesw5-dev xz-utils tk-dev liblzma-dev python3 python3-apt python3-software-properties python3-wheel python3-psutil python3-pip python3-dev python3-all-dev python3-docopt python3-setuptools python3-venv expect nftables autoconf-archive debian-keyring debian-archive-keyring libicu-dev libgeoip-dev
          echo "=====> Upgrading pip..."
            python3 -m pip install --upgrade pip
            local packages=$(pyopenssl service_identity pillow rencode pyxdg chardet setproctitle setuptools wheel cryptography)
          if [[ "${{ matrix.os }}" != "debian-11" ]]; then
            echo "=====> Installing Python packages (+ twisted)..."
            echo "Packages: ${packages}"
            python3 -m pip install ${packages} twisted --break-system-packages
          else
            echo "=====> Installing Python packages..."
            python3 -m pip install ${packages} --break-system-packages
          fi
      - name: Download and install libtorrent packages
        run: |
          for pkg in "libtorrent-rasterbar" "libtorrent-rasterbar-dev" "python3-libtorrent"; do
            FOUND=""
            for suffix in "stable" "oldstable" "next"; do
              FILENAME="${pkg}-${suffix}_${{ matrix.libtorrent_version }}-1build1_${{ matrix.libtorrent_os }}_amd64.deb"
              echo "Trying $FILENAME..."
              if gh release view "v${{ matrix.libtorrent_version }}" -R "MediaEase-binaries/rasterbar-builds" --json assets | grep -q "$FILENAME"; then
                echo "Downloading $FILENAME"
                gh release download "v${{ matrix.libtorrent_version }}" \
                  -R "MediaEase-binaries/rasterbar-builds" \
                  -p "$FILENAME"
                sudo dpkg -i "$FILENAME" || true
                FOUND=1
                break
              fi
            done
          done
          sudo apt-get install -f -y

      - name: Build Deluge
        run: |
          export DELUGE_VERSION="${{ matrix.version }}"
          export LIBTORRENT_VERSION="${{ matrix.libtorrent_version }}"
          export STABILITY="${{ matrix.stability }}"
          export COMMITTER_NAME="${{ secrets.COMMITTER_NAME }}"
          export COMMITTER_EMAIL="${{ secrets.COMMITTER_EMAIL }}"
          chmod +x tools/packages/deluge/build.sh
          cd tools/packages/deluge
          ./build.sh "${{ matrix.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deluge-${{ matrix.version }}-${{ matrix.os }}
          path: |
            tools/packages/deluge/output/*.deb
            tools/packages/deluge/output/*.json

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2.0.5', '2.1.0', '2.1.1', '2.1.2.dev0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts
          pattern: deluge-${{ matrix.version }}*

      - name: Prepare release assets & tables
        id: prepare
        run: |
          mkdir -p release_assets
          find downloaded_artifacts -type f \
          \( -name "*${{ matrix.version }}*.deb" -o \
             -name "*${{ matrix.version }}*.json" \) \
          -exec cp {} release_assets/ \;
          
          TEMP_DIR=$(mktemp -d)
          PACKAGES_TABLE="$TEMP_DIR/packages.md"
          CONFIG_TABLE="$TEMP_DIR/config.md"
          
          {
            echo "| Package | OS | Stability |"
            echo "| ------- | -- | --------- |"
            for f in release_assets/*.deb; do
              if [ -f "$f" ]; then
                pkg=$(basename "$f")
                os=$(echo "$pkg" | grep -o "debian-[^ _]*\|ubuntu-[^ _]*" || echo "unknown")
                stability=$(echo "$pkg" | grep -o "stable\|oldstable\|next")
                echo "| $pkg | $os | $stability |"
              fi
            done
          } > "$PACKAGES_TABLE"
          
          echo "packages_table<<EOF" >> $GITHUB_OUTPUT
          cat "$PACKAGES_TABLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [[ -z "$(ls release_assets/*.deb 2>/dev/null)" ]]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Files prepared for release:"
          ls -la release_assets/
          rm -rf "$TEMP_DIR"

      - name: Create Release
        if: steps.prepare.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          name: Deluge ${{ matrix.version }}
          files: |
            release_assets/*
          draft: false
          prerelease: ${{ matrix.version == '2.1.2.dev0' }}
          generate_release_notes: true
          body: |
            # Deluge v${{ matrix.version }}

            Pre-built Deluge BitTorrent client packages for various Linux distributions.

            ## 🎯 Features

            - Pre-compiled binaries ready to use
            - Multiple distribution support
            - Automated builds via GitHub Actions
            - JSON metadata for automated installations
            - Built with pre-compiled libtorrent-rasterbar packages

            ## 📦 Available Packages

            ${{ steps.prepare.outputs.packages_table }}

            ## 📋 Installation

            ### Manual Installation
            1. Download the appropriate .deb package for your distribution
            2. Install using: `sudo dpkg -i package_name.deb`
            3. Fix any dependencies if needed: `sudo apt-get install -f`

            ## 🔍 Package Details

            The packages are built with:
            - Python 3 support
            - System-wide installation in `/usr/local`
            - Pre-compiled libtorrent-rasterbar integration
            - Configuration files in `/etc/deluge`

            ## 📄 Metadata

            Each package is accompanied by its JSON metadata file containing:
            - Package information
            - Checksums
            - Dependencies
            - Build configuration
            - Distribution details

            ## 📝 License

            Deluge is distributed under the [GNU General Public License v3](https://www.gnu.org/licenses/gpl-3.0.html).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
