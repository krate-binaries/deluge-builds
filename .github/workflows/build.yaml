name: Build & Release Deluge

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Deluge version to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - 2.1.1
          - 2.2.0

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generating matrix
        id: generate
        run: |
          pip3 install --upgrade pyyaml
          echo "Generating matrix..."
          MATRIX=$(python3 matrix.py)
          echo "$MATRIX" > matrix.json
          echo "matrix<<EOF" >> $GITHUB_ENV
          cat matrix.json >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Filter matrix for workflow_dispatch
        run: |
          pip3 install --upgrade pyyaml
          python3 << 'PY'
          import os, sys, yaml
          key = os.environ["MATRIX_VERSION_KEY"]
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          sel = os.environ.get("WF_VERSION", "all")
          with open("matrix.json") as f:
              data = yaml.safe_load(f)
          inc = list(data.get("include") or [])
          if event == "workflow_dispatch" and sel and sel != "all":
              inc = [r for r in inc if str(r.get(key)) == sel]
              if not inc:
                  sys.stderr.write(f"::error::No matrix entry where {key}={sel!r}\n")
                  sys.exit(1)
          with open("matrix.json", "w") as f:
              yaml.safe_dump({"include": inc}, f, sort_keys=False)
          print(yaml.safe_dump({"include": inc}, sort_keys=False))
          PY
          {
            echo 'matrix<<EOF'
            cat matrix.json
            echo 'EOF'
          } >> "$GITHUB_ENV"
        env:
          MATRIX_VERSION_KEY: version
          WF_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || 'all' }}

      - name: Setup matrix
        id: set
        uses: druzsan/setup-matrix@v2
        with:
          matrix: |
            ${{ env.matrix }}

  build:
    name: v${{ matrix.version }} (${{ matrix.os }})
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      COMMITTER_NAME: ${{ secrets.COMMITTER_NAME }}
      COMMITTER_EMAIL: ${{ secrets.COMMITTER_EMAIL }}

    steps:
      - name: Debug context
        run: |
          echo "Matrix: ${{ toJson(matrix) }}"

      - name: Bootstrap container (update + deps)
        id: bootstrap
        shell: bash
        run: |
          apt-get update -qq
          # tools/packages/deluge/build.sh (krate-binaries/tools): git + venv/pip; Boost & libtorrent from Releases
          apt-get install -yqq --no-install-recommends \
            ca-certificates curl wget git jq \
            lsb-release gnupg debian-archive-keyring debian-keyring \
            debconf-utils sudo \
            build-essential pkg-config \
            python3 python3-venv python3-pip python3-dev \
            python3-setuptools python3-wheel \
            zlib1g-dev libssl-dev libffi-dev libjpeg-dev libpng-dev \
            libbz2-dev libreadline-dev gzip xz-utils file patchelf
          echo "bootstrap=done" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.bootstrap.outputs.bootstrap == 'done'
        uses: actions/checkout@v6

      - name: Checkout tools repository
        if: steps.bootstrap.outputs.bootstrap == 'done'
        uses: actions/checkout@v6
        with:
          repository: krate-binaries/tools
          path: tools

      - name: Prepare tools scripts
        if: steps.bootstrap.outputs.bootstrap == 'done'
        run: find tools/ -name "*.sh" -exec chmod +x {} +

      - name: Download and install boost
        id: boost
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "BOOST_VERSION=${{ matrix.boost_version }}" >> $GITHUB_OUTPUT
          echo "Selected Boost version: ${{ matrix.boost_version }}"
          chmod +x tools/ci/install_boost_from_boost_builds.sh
          tools/ci/install_boost_from_boost_builds.sh "${{ matrix.boost_version }}"
          echo "boost=done" >> $GITHUB_OUTPUT

      - name: Download and install libtorrent packages
        if: steps.boost.outputs.boost == 'done'
        id: libtorrent
        run: |
          download_asset() {
            local version="$1"
            local filename="$2"
            local repo="krate-binaries/rasterbar-builds"
            local assets_url=$(curl -s "https://api.github.com/repos/${repo}/releases/tags/v${version}" | jq -r '.assets_url')
            if [ -z "$assets_url" ] || [ "$assets_url" = "null" ]; then
              echo "Release not found"
              return 1
            fi
            local download_url=$(curl -s "${assets_url}" | jq -r ".[] | select(.name == \"${filename}\") | .browser_download_url")
            if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
              echo "Asset not found"
              return 1
            fi
            echo "Downloading from: ${download_url}"
            if command -v curl >/dev/null 2>&1; then
              curl -L -o "${filename}" "${download_url}"
            else
              wget -O "${filename}" "${download_url}"
            fi
            return 0
          }

          for pkg in "krate-libtorrent-rasterbar" "krate-libtorrent-rasterbar-dev" "krate-python3-libtorrent"; do
            FILENAME="${pkg}_${{ matrix.libtorrent_version }}-1_amd64.deb"
            echo "Trying $FILENAME..."
            if download_asset "${{ matrix.libtorrent_version }}" "${FILENAME}"; then
              echo "Installing $FILENAME"
              sudo dpkg -i "${FILENAME}" || true
            else
              echo "::error::No suitable package found for $pkg"
              exit 1
            fi
          done
          sudo apt-get install -f -y
          echo "libtorrent=done" >> $GITHUB_OUTPUT
          echo "======> Libtorrent packages installed successfully"
          echo "=====> Testing libtorrent..."
          python3 --version
          if python3 -c "import libtorrent as lt; print(lt.version)" 2>/dev/null; then
            echo "libtorrent version: $(python3 -c "import libtorrent as lt; print(lt.version)")"
          else
            echo "::error::Python cannot import libtorrent (KRATE python3-libtorrent .deb likely missing the extension module — rebuild rasterbar-builds after tools fix)."
            python3 -c "import sys; print(sys.path)" || true
            dpkg -L python3-libtorrent 2>/dev/null || true
            exit 1
          fi

      - name: Build Deluge
        id: deluge
        if: steps.libtorrent.outputs.libtorrent == 'done'
        run: |
          export DELUGE_VERSION="${{ matrix.version }}"
          export LIBTORRENT_VERSION="${{ matrix.libtorrent_version }}"
          export BOOST_VERSION="${{ matrix.boost_version }}"
          export COMMITTER_NAME="${{ secrets.COMMITTER_NAME }}"
          export COMMITTER_EMAIL="${{ secrets.COMMITTER_EMAIL }}"
          chmod +x tools/packages/deluge/build.sh
          cd tools/packages/deluge
          ./build.sh "${{ matrix.version }}"
          echo "deluge=done" >> $GITHUB_OUTPUT

      - name: Generate metadata & upload artifacts
        if: steps.deluge.outputs.deluge == 'done'
        run: |
          deb_files=$(find tools/packages/deluge/output -maxdepth 1 -name 'krate-deluge_*.deb' 2>/dev/null || true)
          echo "Found DEB files: $deb_files"
          mkdir -p artifacts
          for deb_file in $deb_files; do
            echo "Processing DEB: $deb_file"
            base=$(basename "$deb_file" .deb)
            cp "$deb_file" "artifacts/${base}.deb"
            echo "Generating metadata for ${base}.deb"
            cd artifacts
            ../tools/generate_metadata.sh \
              --category "deluge" \
              --tag      "release" \
              --version  "${{ matrix.version }}" \
              --os       "${{ matrix.codename }}" \
              "${base}.deb"
            cd ..
          done
          echo "Final artifacts directory contents:"
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: steps.deluge.outputs.deluge == 'done'
        with:
          name: deluge-${{ matrix.version }}_lt_${{ matrix.libtorrent_version }}_${{ matrix.os }}
          path: |
            artifacts/
        env:
          COMMITTER_NAME: ${{ secrets.COMMITTER_NAME }}
          COMMITTER_EMAIL: ${{ secrets.COMMITTER_EMAIL }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["2.1.1", "2.2.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout tools repository
        uses: actions/checkout@v6
        with:
          repository: krate-binaries/tools
          path: tools

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts
          pattern: deluge-${{ matrix.version }}_lt_*

      - name: List downloaded artifacts
        run: |
          echo "Downloaded files:"
          find downloaded_artifacts -type f

      - name: Prepare release assets & tables
        id: prepare
        run: |
          mkdir -p release_assets
          find downloaded_artifacts -type f \
          \( -name 'krate-deluge_*.deb' -o -name 'krate-deluge_*.json' \) \
          -exec cp {} release_assets/ \;

          pip3 install --upgrade pyyaml
          python3 tools/ci/release_notes.py \
            --product deluge \
            --version "${{ matrix.version }}" \
            --assets-dir release_assets \
            --github-output

          if [[ -z "$(ls release_assets/*.deb 2>/dev/null)" ]]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi

          echo "Files prepared for release:"
          ls -la release_assets/

      - name: Create Release
        if: steps.prepare.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ matrix.version }}
          name: Deluge ${{ matrix.version }}
          files: |
            release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ${{ steps.prepare.outputs.release_body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
